<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        <main>
            <div class="sources buttons" role="group" aria-label="News sources"></div>
            <p class="app-status" role="status" aria-live="polite" hidden></p>
            <div class="news"></div>
        </main>
        <footer>
            <div class="footer-content">
                <p class="copyright">
                    <span>© 2026</span>
                    <a href="https://github.com/SvitlanaG" target="_blank" rel="noopener noreferrer">SvitlanaG</a>
                    <span class="footer-divider" aria-hidden="true">·</span>
                    <span>News powered by <a href="https://newsapi.org" target="_blank" rel="noopener noreferrer">NewsAPI</a></span>
                </p>
                <a
                    class="course-link"
                    href="https://rs.school/courses/javascript"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="RS School JavaScript course"
                >
                    <img
                        src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg"
                        alt="RS School"
                        width="112"
                        height="40"
                    />
                </a>
            </div>
        </footer>

        <template id="sourceItemTemp">
            <button class="source__item" type="button" aria-pressed="false">
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#" target="_blank" rel="noopener noreferrer">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
